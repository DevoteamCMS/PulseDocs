<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" width="100%" role="img" aria-labelledby="scnTitle scnDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="scnTitle">Four allocation scenarios</title>
  <desc id="scnDesc">Four panels, each showing an Azure subscription, a resource group and an asset, which tag each carries in the cloud, and which asset group it ends up in. Scenario one: everything tagged lands in AG1 by tag, the asset inherits. Scenario two: the resource group is allocated directly to AG2, overriding its tag, and its asset inherits AG2. Scenario three: the resource group goes directly to AG2 but the tagged asset stays in AG1. Scenario four: the subscription is allocated directly to AG2 and the resource group inherits it, while the tagged asset stays in AG1.</desc>

  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#b9b2c0"/>
    </marker>
  </defs>

  <!-- ============ Scenario 1 ============ -->
  <rect x="20" y="60" width="520" height="280" rx="8" fill="#ffffff" stroke="#d8d3de" stroke-width="1.5"/>
  <text x="36" y="86" font-size="13.5" font-weight="600" fill="#3d3646">Scenario 1 &#183; tag-based, the common case</text>

  <rect x="36" y="106" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="111" y="131" font-size="12.5" fill="#3d3646" text-anchor="middle">Subscription</text>
  <rect x="196" y="106" width="164" height="40" rx="5" fill="#f7f5f9" stroke="#c9c2d0"/>
  <text x="278" y="131" font-size="11" fill="#7a7385" text-anchor="middle">tag: product:App1</text>
  <rect x="370" y="106" width="154" height="40" rx="5" fill="#eef2f7" stroke="#96a8c0"/>
  <text x="447" y="131" font-size="12.5" font-weight="500" fill="#26313f" text-anchor="middle">AG1 &#183; by tag</text>
  <line x1="111" y1="148" x2="111" y2="160" stroke="#b9b2c0" marker-end="url(#down)"/>

  <rect x="36" y="162" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="111" y="187" font-size="12.5" fill="#3d3646" text-anchor="middle">Resource group</text>
  <rect x="196" y="162" width="164" height="40" rx="5" fill="#f7f5f9" stroke="#c9c2d0"/>
  <text x="278" y="187" font-size="11" fill="#7a7385" text-anchor="middle">tag: product:App1</text>
  <rect x="370" y="162" width="154" height="40" rx="5" fill="#eef2f7" stroke="#96a8c0"/>
  <text x="447" y="187" font-size="12.5" font-weight="500" fill="#26313f" text-anchor="middle">AG1 &#183; by tag</text>
  <line x1="111" y1="204" x2="111" y2="216" stroke="#b9b2c0" marker-end="url(#down)"/>

  <rect x="36" y="218" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="111" y="243" font-size="12.5" fill="#3d3646" text-anchor="middle">Asset</text>
  <text x="278" y="243" font-size="12" fill="#b9b2c0" text-anchor="middle">no tag</text>
  <rect x="370" y="218" width="154" height="40" rx="5" fill="#f0edf2" stroke="#a79fb2"/>
  <text x="447" y="243" font-size="12.5" font-weight="500" fill="#3d3646" text-anchor="middle">AG1 &#183; inherited</text>

  <text x="36" y="288" font-size="11.5" fill="#7a7385">Create AG1 and give it the tag value. Everything carrying the tag</text>
  <text x="36" y="306" font-size="11.5" fill="#7a7385">lands in it, and the untagged asset inherits from its parent.</text>

  <!-- ============ Scenario 2 ============ -->
  <rect x="580" y="60" width="520" height="280" rx="8" fill="#ffffff" stroke="#d8d3de" stroke-width="1.5"/>
  <text x="596" y="86" font-size="13.5" font-weight="600" fill="#3d3646">Scenario 2 &#183; two applications, one subscription</text>

  <rect x="596" y="106" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="671" y="131" font-size="12.5" fill="#3d3646" text-anchor="middle">Subscription</text>
  <rect x="756" y="106" width="164" height="40" rx="5" fill="#f7f5f9" stroke="#c9c2d0"/>
  <text x="838" y="131" font-size="11" fill="#7a7385" text-anchor="middle">tag: product:App1</text>
  <rect x="930" y="106" width="154" height="40" rx="5" fill="#eef2f7" stroke="#96a8c0"/>
  <text x="1007" y="131" font-size="12.5" font-weight="500" fill="#26313f" text-anchor="middle">AG1 &#183; by tag</text>
  <line x1="671" y1="148" x2="671" y2="160" stroke="#b9b2c0" marker-end="url(#down)"/>

  <rect x="596" y="162" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="671" y="187" font-size="12.5" fill="#3d3646" text-anchor="middle">Resource group</text>
  <rect x="756" y="162" width="164" height="40" rx="5" fill="#f7f5f9" stroke="#c9c2d0"/>
  <text x="838" y="187" font-size="11" fill="#7a7385" text-anchor="middle">tag: product:App1</text>
  <rect x="930" y="162" width="154" height="40" rx="5" fill="#fdf1f3" stroke="#c8102e"/>
  <text x="1007" y="187" font-size="12.5" font-weight="600" fill="#c8102e" text-anchor="middle">AG2 &#183; direct</text>
  <line x1="671" y1="204" x2="671" y2="216" stroke="#b9b2c0" marker-end="url(#down)"/>

  <rect x="596" y="218" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="671" y="243" font-size="12.5" fill="#3d3646" text-anchor="middle">Asset</text>
  <text x="838" y="243" font-size="12" fill="#b9b2c0" text-anchor="middle">no tag</text>
  <rect x="930" y="218" width="154" height="40" rx="5" fill="#f0edf2" stroke="#a79fb2"/>
  <text x="1007" y="243" font-size="12.5" font-weight="500" fill="#3d3646" text-anchor="middle">AG2 &#183; inherited</text>

  <text x="596" y="288" font-size="11.5" fill="#7a7385">The resource group belongs to another team. Allocating it directly</text>
  <text x="596" y="306" font-size="11.5" fill="#7a7385">to AG2 overrides its tag, and its assets follow it.</text>

  <!-- ============ Scenario 3 ============ -->
  <rect x="20" y="380" width="520" height="280" rx="8" fill="#ffffff" stroke="#d8d3de" stroke-width="1.5"/>
  <text x="36" y="406" font-size="13.5" font-weight="600" fill="#3d3646">Scenario 3 &#183; resource group split across teams</text>

  <rect x="36" y="426" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="111" y="451" font-size="12.5" fill="#3d3646" text-anchor="middle">Subscription</text>
  <rect x="196" y="426" width="164" height="40" rx="5" fill="#f7f5f9" stroke="#c9c2d0"/>
  <text x="278" y="451" font-size="11" fill="#7a7385" text-anchor="middle">tag: product:App1</text>
  <rect x="370" y="426" width="154" height="40" rx="5" fill="#eef2f7" stroke="#96a8c0"/>
  <text x="447" y="451" font-size="12.5" font-weight="500" fill="#26313f" text-anchor="middle">AG1 &#183; by tag</text>
  <line x1="111" y1="468" x2="111" y2="480" stroke="#b9b2c0" marker-end="url(#down)"/>

  <rect x="36" y="482" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="111" y="507" font-size="12.5" fill="#3d3646" text-anchor="middle">Resource group</text>
  <text x="278" y="507" font-size="12" fill="#b9b2c0" text-anchor="middle">no tag</text>
  <rect x="370" y="482" width="154" height="40" rx="5" fill="#fdf1f3" stroke="#c8102e"/>
  <text x="447" y="507" font-size="12.5" font-weight="600" fill="#c8102e" text-anchor="middle">AG2 &#183; direct</text>
  <line x1="111" y1="524" x2="111" y2="536" stroke="#b9b2c0" marker-end="url(#down)"/>

  <rect x="36" y="538" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="111" y="563" font-size="12.5" fill="#3d3646" text-anchor="middle">Asset</text>
  <rect x="196" y="538" width="164" height="40" rx="5" fill="#f7f5f9" stroke="#c9c2d0"/>
  <text x="278" y="563" font-size="11" fill="#7a7385" text-anchor="middle">tag: product:App1</text>
  <rect x="370" y="538" width="154" height="40" rx="5" fill="#eef2f7" stroke="#96a8c0"/>
  <text x="447" y="563" font-size="12.5" font-weight="500" fill="#26313f" text-anchor="middle">AG1 &#183; by tag</text>

  <text x="36" y="608" font-size="11.5" fill="#7a7385">The asset carries its own tag, so it does not follow the resource</text>
  <text x="36" y="626" font-size="11.5" fill="#7a7385">group it sits in. Possible, but hard to reason about later.</text>

  <!-- ============ Scenario 4 ============ -->
  <rect x="580" y="380" width="520" height="280" rx="8" fill="#ffffff" stroke="#d8d3de" stroke-width="1.5"/>
  <text x="596" y="406" font-size="13.5" font-weight="600" fill="#3d3646">Scenario 4 &#183; an asset that must not follow its parent</text>

  <rect x="596" y="426" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="671" y="451" font-size="12.5" fill="#3d3646" text-anchor="middle">Subscription</text>
  <text x="838" y="451" font-size="12" fill="#b9b2c0" text-anchor="middle">no tag</text>
  <rect x="930" y="426" width="154" height="40" rx="5" fill="#fdf1f3" stroke="#c8102e"/>
  <text x="1007" y="451" font-size="12.5" font-weight="600" fill="#c8102e" text-anchor="middle">AG2 &#183; direct</text>
  <line x1="671" y1="468" x2="671" y2="480" stroke="#b9b2c0" marker-end="url(#down)"/>

  <rect x="596" y="482" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="671" y="507" font-size="12.5" fill="#3d3646" text-anchor="middle">Resource group</text>
  <text x="838" y="507" font-size="12" fill="#b9b2c0" text-anchor="middle">no tag</text>
  <rect x="930" y="482" width="154" height="40" rx="5" fill="#f0edf2" stroke="#a79fb2"/>
  <text x="1007" y="507" font-size="12.5" font-weight="500" fill="#3d3646" text-anchor="middle">AG2 &#183; inherited</text>
  <line x1="671" y1="524" x2="671" y2="536" stroke="#b9b2c0" marker-end="url(#down)"/>

  <rect x="596" y="538" width="150" height="40" rx="5" fill="#fbfafc" stroke="#d8d3de"/>
  <text x="671" y="563" font-size="12.5" fill="#3d3646" text-anchor="middle">Asset</text>
  <rect x="756" y="538" width="164" height="40" rx="5" fill="#f7f5f9" stroke="#c9c2d0"/>
  <text x="838" y="563" font-size="11" fill="#7a7385" text-anchor="middle">tag: product:App1</text>
  <rect x="930" y="538" width="154" height="40" rx="5" fill="#eef2f7" stroke="#96a8c0"/>
  <text x="1007" y="563" font-size="12.5" font-weight="500" fill="#26313f" text-anchor="middle">AG1 &#183; by tag</text>

  <text x="596" y="608" font-size="11.5" fill="#7a7385">Allocating the subscription directly to AG2 pulls the resource group</text>
  <text x="596" y="626" font-size="11.5" fill="#7a7385">with it, while the tagged asset still lands in AG1.</text>

  <!-- ============ legend ============ -->
  <rect x="270" y="692" width="14" height="14" rx="3" fill="#eef2f7" stroke="#96a8c0"/>
  <text x="292" y="704" font-size="12" fill="#3d3646">by tag</text>

  <rect x="380" y="692" width="14" height="14" rx="3" fill="#fdf1f3" stroke="#c8102e"/>
  <text x="402" y="704" font-size="12" fill="#3d3646">direct - overrides the tag</text>

  <rect x="576" y="692" width="14" height="14" rx="3" fill="#f0edf2" stroke="#a79fb2"/>
  <text x="598" y="704" font-size="12" fill="#3d3646">inherited from the parent</text>

  <text x="790" y="704" font-size="11.5" fill="#7a7385">Azure is shown because its extra level makes inheritance clearest.</text>
</svg>
